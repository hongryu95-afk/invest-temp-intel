# 일회성 탐침 — 데이터센터 IP에서 야후가 긁히는지만 본다.
# 스케줄 없음. 이 파일을 push하거나 Actions 탭에서 수동 실행할 때만 돈다.
# 판단이 끝나면 이 워크플로는 지운다.
name: yahoo probe (one-off)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/yahoo-probe.yml'
      - 'tools/yahoo_probe.py'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tools/yahoo_probe.py 503
      # Actions 로그는 로그인해야 보인다 — 결과를 저장소에 커밋해서 받는다
      - name: 결과 커밋
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f tools/yahoo_probe_result.txt
          git diff --staged --quiet && exit 0
          git commit -m "야후 탐침 결과"
          git push
